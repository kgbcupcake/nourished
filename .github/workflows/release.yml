name: Release

on:
    push:
        tags:
            - 'v*.*.*'

permissions:
    contents: write

jobs:
    release:
        name: Build & Release
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Java 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'

            - name: Cache Gradle
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-${{ github.ref_name }}
                  restore-keys: gradle-

            - name: Build mod jar
              run: ./gradlew clean build --no-daemon

            - name: Locate built jar
              id: jar
              run: |
                  JAR=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -1)
                  echo "path=$JAR" >> $GITHUB_OUTPUT
                  echo "name=$(basename $JAR)" >> $GITHUB_OUTPUT

            - name: Install git-cliff
              uses: taiki-e/install-action@v2
              with:
                  tool: git-cliff

            - name: Generate release notes
              run: |
                  git-cliff --config cliff.toml --latest --strip header > RELEASE_NOTES.md
                  cat RELEASE_NOTES.md

            - name: Update full CHANGELOG.md
              run: |
                  git-cliff --config cliff.toml --bump --output CHANGELOG.md
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add CHANGELOG.md
                  git diff --staged --quiet || git commit -m "chore(changelog): update for ${{ github.ref_name }} [skip ci]"
                  git push origin HEAD:main || true

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: 'Nourished ${{ github.ref_name }}'
                  body_path: RELEASE_NOTES.md
                  draft: false
                  prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
                  files: ${{ steps.jar.outputs.path }}
                  overwrite_files: true

            - name: Upload to Modrinth
              uses: Kir-Antipov/mc-publish@v3.3
              with:
                  modrinth-id: gXy6YNys
                  modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
                  files: ${{ steps.jar.outputs.path }}
                  name: 'Nourished ${{ github.ref_name }}'
                  changelog-file: RELEASE_NOTES.md
                  game-versions: '1.21.1'
                  loaders: neoforge
                  version-type: ${{ contains(github.ref_name, 'alpha') && 'alpha' || contains(github.ref_name, 'beta') && 'beta' || 'release' }}
