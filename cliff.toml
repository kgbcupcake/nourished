# git-cliff configuration for Nourished mod
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to Nourished will be documented here.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
topo_order = false
sort_commits = "oldest"
tag_pattern = "v[0-9].*"

commit_preprocessors = [
  { pattern = '\.$', replace = "" },
]

commit_parsers = [
  { message = "^.*\\[skip ci\\]",        skip = true },
  { message = "^chore\\(changelog\\)",   skip = true },
  { message = "^chore: update",          skip = true },
  { message = "^chore\\(release\\)",     skip = true },
  { message = "^chore",                  skip = true },
  { message = "^test",                   skip = true },
  { message = "^ci",                     skip = true },
  { message = "^style",                  skip = true },
  { message = "^build",                  skip = true },
  { message = "^feat",    group = "🚀 Features" },
  { message = "^fix",     group = "🐛 Bug Fixes" },
  { message = "^perf",    group = "⚡ Performance" },
  { message = "^refactor",group = "🚜 Refactor" },
  { message = "^compat",  group = "🔌 Mod Compatibility" },
  { message = "^content", group = "🍎 Content" },
  { message = "^tags",    group = "🏷️ Food Tags" },
  { message = "^docs",    group = "📖 Documentation" },
  { message = ".*",       skip = true },
]
