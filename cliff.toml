# git-cliff configuration for Nourished mod
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to Nourished will be documented here.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
topo_order = false
sort_commits = "oldest"

# Filter out pure noise — changelog bot, skip-ci, and version bump commits
commit_preprocessors = [
  # Strip trailing periods
  { pattern = '\.$', replace = "" },
]

commit_parsers = [
  # Skip all changelog update bot commits
  { message = "^.*\\[skip ci\\]", skip = true },
  { message = "^chore\\(changelog\\)", skip = true },
  { message = "^chore: update changelog", skip = true },

  # Skip version bump commits
  { message = "^chore: update version", skip = true },
  { message = "^chore\\(release\\)", skip = true },

  # Real sections — these become changelog entries
  { message = "^feat", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "🚜 Refactor" },
  { message = "^compat", group = "🔌 Mod Compatibility" },
  { message = "^content", group = "🍎 Content" },
  { message = "^tags", group = "🏷️ Food Tags" },
  { message = "^docs", group = "📖 Documentation" },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },
  { message = "^style", skip = true },
  { message = "^build", skip = true },
  { message = "^Enhance", skip = true },
  { message = "^Improve", skip = true },
  { message = "^Update", skip = true },
  { message = "^Add", skip = true },
  { message = "^Implement", skip = true },
  { message = "^Introduce", skip = true },
  { message = "^Streamline", skip = true },
  { message = "^Optimize", skip = true },
  { message = "^Expand", skip = true },
  { message = "^Register", skip = true },
  { message = "^Include", skip = true },

  # Catch-all for anything unconventional that slips through
  { message = ".*", group = "💼 Other", skip = true },
]

# Only include tags that look like version tags
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
