plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.logging.console.level', 'debug'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories
{
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases/'
    }

    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.latvian.dev/releases' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }

    maven
    {
    name = 'GitHubPackages'
    url = 'https://maven.pkg.github.com/kgbcupcake/MarieLib'
    credentials {
        username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
        password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
    }
   }

}
dependencies {
    implementation "dev.marie.MariesLib:marieslib:${marie_lib_version}"
    if (!gradle.ext.localMarieLibPresent) {
        additionalRuntimeClasspath "dev.marie.MariesLib:marieslib:${marie_lib_version}"
    }

    implementation "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    compileOnly "mezz.jei:jei-1.21.1-common-api:+"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:+"
    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:+"
    compileOnly "dev.emi:emi-neoforge:+"
    compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}:api"
    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
    compileOnly "maven.modrinth:spice-of-life-onion:${spice_of_life_onion_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            marie_lib_version_range: marie_lib_version_range,

    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }

    doLast {
        try {
            file("${sourceSets.main.output.resourcesDir}/.gitversion-${mod_id}").text = 'git log "-1" "--format=%h"'.execute().in.text.trim()
        } catch (Exception ignored) {
            file("${sourceSets.main.output.resourcesDir}/.gitversion-${mod_id}").text = 'unknown'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Local MarieLib composite build: compile Nourished only after MarieLib classes exist.
if (gradle.ext.localMarieLibPresent) {
    def marieLibIncluded = gradle.includedBuilds.find { it.name == 'MarieLib' }
    if (marieLibIncluded != null) {
        tasks.named('compileJava').configure {
            dependsOn marieLibIncluded.task(':classes')
        }
        tasks.named('compileTestJava').configure {
            dependsOn marieLibIncluded.task(':classes')
        }
    }
}
