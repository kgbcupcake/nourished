pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'NutritionalBalance'

// Sibling checkout: load MarieLib as a composite subproject so NeoForge dev runs register it as a mod.
if (file('../MarieLib/build.gradle').exists()) {
    include 'MarieLib'
    project(':MarieLib').projectDir = file('../MarieLib')
}
